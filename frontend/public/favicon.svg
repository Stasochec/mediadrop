<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#accent)" stroke-width="6" opacity="0.4" fill="none" />

  <!-- Neon Glowing Drop Arrow / Play Symbol -->
  <g filter="url(#glow)">
    <!-- Downward Arrow with Play Triangle inside -->
    <path d="M256 120 V 300" stroke="url(#accent)" stroke-width="36" stroke-linecap="round"/>
    <path d="M180 240 L 256 320 L 332 240" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tray / Bowl -->
    <path d="M140 340 V 380 C 140 400 160 410 180 410 H 332 C 352 410 372 400 372 380 V 340" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>