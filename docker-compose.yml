version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediadrop_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/downloads:/app/downloads
    environment:
      - MEDIA_DIR=/app/downloads
      - CACHE_MAX_AGE_SECONDS=1200
      - HOST=0.0.0.0
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediadrop_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
